# Seams served by external programs.
#
# This works today. The engine writes one JSON request per line on each
# program's standard input and reads one JSON answer per line from its
# standard output. A program needs no dependency on this SDK and may be
# written in any language.
#
#   interpreter  -> {"utterance":"half of last time","styles":[...]}
#                <- {"intent":{"kind":"produce","targets":{...}}}
#                or {"clarify":{"question":"...","because":"..."}}
#
#   transcriber  -> {"audio":"<base64>","sample_rate":16000}
#                <- {"text":"...","confidence":0.91}
#
#   speaker      -> {"text":"..."}
#                <- {"audio":"<base64>","sample_rate":22050}
#
# Audio is base64 of 16-bit signed, little endian, single channel samples.
#
# The programs referenced below are working implementations of the protocol
# and contain no models. Replace them with your own.
#
# The command is whatever starts Python on your system. On most Linux and
# macOS installations that is python3; on Windows it is usually python,
# because python3 there is a store shim that exits immediately.

root: .

seams:
  interpreter:
    backend: process
    command: python3
    args: ["examples/interpreters/reference.py"]

  transcriber:
    backend: process
    command: python3
    args: ["examples/interpreters/reference_speech.py", "transcribe"]
    sample_rate: 16000
    min_confidence: 0.6

  speaker:
    backend: process
    command: python3
    args: ["examples/interpreters/reference_speech.py", "speak"]
    sample_rate: 22050
