# Model files loaded by programs that run beside the engine.
#
# This is the configuration to use once the model files are in place. It runs
# real models, through the backends in examples/interpreters/.
#
# First:
#     pip install -r requirements.txt
#     adi models check          # reports which files are missing, and where
#                               # to obtain each one
#
# The command below is whatever starts Python on your system. On most Linux
# and macOS installations that is python3; on Windows it is usually python,
# because python3 there is a store shim that exits immediately.

root: .

seams:
  interpreter:
    backend: process
    command: python
    args:
      - "examples/interpreters/qwen_interpreter.py"
      - "models/interpreter/qwen3-4b-q4_k_m.gguf"

  transcriber:
    backend: process
    command: python
    args:
      - "examples/interpreters/speech_backends.py"
      - "transcribe"
      # A model name, not a path. The useful-moonshine-onnx package fetches
      # and caches the weights itself, and a path here is read as a model name
      # it does not recognise.
      - "moonshine/base"
    sample_rate: 16000
    min_confidence: 0.6

  speaker:
    backend: process
    command: python
    args:
      - "examples/interpreters/speech_backends.py"
      - "speak"
      - "models/speaker/en_GB-alba-medium.onnx"
    sample_rate: 22050

  # The explainer needs no model. RecordExplainer produces text from the
  # decision record, which is accurate though stilted. A language model here
  # improves the wording, not the facts.
  explainer:
    backend: none
