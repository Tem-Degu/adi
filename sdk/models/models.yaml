# Which file or program serves which seam.
#
# This ships with every seam unconfigured, which is a supported state: an
# engine refuses the operations an unserved seam provides and names the seam,
# rather than failing.
#
# Two templates are provided. Copy the parts you need into this file.
#
#   models.example-process.yaml   a seam served by an external program. This
#                                 works today and is how a model of your own
#                                 choosing is used.
#
#   models.example-local.yaml     a seam served by a model file loaded into
#                                 the engine. The llama and onnx backends are
#                                 not implemented, so this is the intended
#                                 shape rather than a working configuration.
#
# Check the result with:
#
#   adi models check --config models/models.yaml

root: .

seams:
  transcriber:
    backend: none

  interpreter:
    backend: none

  # The explainer needs no model. RecordExplainer produces text from the
  # decision record, which is stilted but accurate, and a screen or a log can
  # show it. A language model here improves the wording, not the facts.
  explainer:
    backend: none

  speaker:
    backend: none
