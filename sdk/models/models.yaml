# Which file serves which seam.
#
# Copy this, point it at what you have, and pass it to the engine. A seam left
# as `none` reports itself missing rather than failing: ADI-P 9.4.2 permits an
# engine to ship without a model provided it names what it cannot do.
#
# `adi models check --config models/models.yaml` reports the result.

root: .

seams:
  interpreter:
    backend: llama
    model: interpreter/qwen3-1.7b-instruct-q4_k_m.gguf
    context_tokens: 2048

  transcriber:
    backend: onnx
    model: transcriber/moonshine-base.onnx
    sample_rate: 16000
    min_confidence: 0.6

  speaker:
    backend: onnx
    model: speaker/en_GB-alba-medium.onnx
    sample_rate: 22050

  # The explainer shares the interpreter's model by default. A second language
  # model resident on an appliance costs a gigabyte or more to produce a
  # different kind of sentence from the same decision record.
  explainer:
    backend: none
