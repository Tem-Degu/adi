# Espresso base knowledge. Layer 0, owned by StreetAI.
#
# Data, not code. Diagnosis rule *ordering* lives in rules.rs because it is
# logic; everything here is values the engine reads.
#
# Manufacturers never edit this file. They add their own layer under their
# namespace, and constraint monotonicity means their layer can only narrow what
# is here. See PROTOCOL.md section 6.

profile: "espresso/v1"
knowledge_version: "1.0"

variables:
  dose_mass:
    unit: g
    description: >
      Dry coffee going in. More gives a stronger result and slows extraction.
  yield_mass:
    unit: g
    description: >
      Liquid coming out. More gives a longer, weaker drink.
  ratio:
    unit: none
    description: >
      yield_mass divided by dose_mass. Low is concentrated and syrupy, high is
      long and dilute.
  shot_time:
    unit: s
    description: >
      Seconds from first drip to stop. Short means under-extracted, which
      tastes sour and thin; long means over-extracted, which tastes bitter and
      harsh.
  grind_setting:
    unit: step
    description: >
      Grinder position. Finer slows the flow and lengthens the shot; coarser
      speeds it up.
  brew_temperature:
    unit: c
    description: >
      Water temperature at the group. Higher extracts more, towards bitter;
      lower extracts less, towards sour.
  extraction_yield:
    unit: pct
    description: >
      Percentage of the dry coffee dissolved into the drink, measured with a
      refractometer. The direct measure of extraction, where available.
  flow_peak:
    unit: g_per_s
    description: >
      Fastest mass flow during the shot. High suggests the puck offered little
      resistance.
  flow_variance:
    unit: none
    description: >
      Irregularity of flow through the shot. High indicates channelling, where
      water found a path through the puck rather than passing evenly.

  # Preference variables. These express what someone likes rather than how the
  # machine performed, so the engine never adjusts one to correct a process
  # fault. See PROTOCOL.md 7.1 and preference_variables below.
  milk_volume:
    unit: ml
    description: >
      Milk added to the drink. A preference: it is what someone asked for, not
      a measure of how the extraction went.
  sugar_mass:
    unit: g
    description: >
      Sugar added to the drink. A preference.
  syrup_volume:
    unit: ml
    description: >
      Flavoured syrup added to the drink. A preference.

styles:
  - id: "adi.espresso.style.espresso"
    targets:
      ratio:            { min: 1.8,  max: 2.4,  unit: none }
      shot_time:        { min: 25.0, max: 32.0, unit: s }
      brew_temperature: { min: 90.0, max: 96.0, resolution: 0.5, unit: c }

  - id: "adi.espresso.style.ristretto"
    inherits: "adi.espresso.style.espresso"
    targets:
      ratio:     { min: 1.2,  max: 1.8,  unit: none }
      shot_time: { min: 22.0, max: 30.0, unit: s }

  - id: "adi.espresso.style.lungo"
    inherits: "adi.espresso.style.espresso"
    targets:
      ratio:     { min: 3.0,  max: 4.0,  unit: none }
      shot_time: { min: 28.0, max: 40.0, unit: s }

  - id: "adi.espresso.style.for_milk"
    inherits: "adi.espresso.style.espresso"
    targets:
      ratio:     { min: 1.5,  max: 2.0,  unit: none }
      shot_time: { min: 25.0, max: 32.0, unit: s }

# Starting points by roast. Offsets apply to the user's current setting; they
# are not absolute values, because grinder scales are not comparable.
# Roast changes how the coffee behaves: where the grind starts and how hot it
# should be brewed. It does not change what a drink is. Ratio is what separates
# a ristretto from a lungo, so it belongs to the style and is deliberately
# absent here.
#
# An earlier version put a ratio on the light and dark roasts, written with a
# plain espresso in mind. Light asked for 2.0 to 2.6 while a lungo is 3.0 to
# 4.0, so no value satisfied both and a lungo from light roast beans could not
# be resolved at all. It is an ordinary drink.
material_priors:
  - id: "adi.espresso.roast.light"
    attributes: { roast: "light" }
    offsets: { grind_setting: -3.0 }
    targets:
      brew_temperature: { min: 92.0, max: 96.0, unit: c }

  - id: "adi.espresso.roast.medium"
    attributes: { roast: "medium" }
    offsets: { grind_setting: 0.0 }
    targets:
      brew_temperature: { min: 91.0, max: 94.0, unit: c }

  - id: "adi.espresso.roast.dark"
    attributes: { roast: "dark" }
    offsets: { grind_setting: 2.0 }
    targets:
      brew_temperature: { min: 88.0, max: 92.0, unit: c }

# Used only where a skill declares no response for a variable. Deliberately
# conservative: a wrong big step costs a whole cycle and a bag of beans.
default_steps:
  shot_time:        { value: 2.0, unit: s }
  ratio:            { value: 0.1, unit: none }
  brew_temperature: { value: 0.5, unit: c }

# The quality envelope. Distinct from any machine's safety envelope, which
# lives in firmware and is unreachable from here.
constraints:
  brew_temperature: { min: 85.0, max: 98.0, unit: c }
  ratio:            { min: 1.0,  max: 4.0,  unit: none }
  shot_time:        { min: 15.0, max: 60.0, unit: s }

# Additives are preference variables. The engine must never try to fix a taste
# fault by changing them. See PROTOCOL.md 7.1.
preference_variables:
  - milk_volume
  - sugar_mass
  - syrup_volume

# What the machine can tell a person, beyond what the structured data above
# already says. Free text, and what belongs here is a judgement for whoever
# writes the profile rather than something the protocol prescribes.
#
# Every note is sent to the model on every utterance. There is no relevance
# filter, so keeping the total within the context of the smallest model the
# product targets is the author's responsibility.
#
# The rule: a note may inform an answer and may never determine an action. No
# targets and no effect magnitudes, because those belong in styles and in the
# skill, where they are validated.
notes:
  - id: "adi.espresso.note.sour_vs_bitter"
    text: >
      Sour usually means under-extraction: the water passed through too quickly
      to dissolve enough. Bitter usually means the opposite. Shot time is the
      usual indicator of which has happened.

  - id: "adi.espresso.note.channelling"
    text: >
      Channelling is water finding a path of least resistance through the puck
      rather than passing through it evenly. The result tastes both sour and
      bitter at once, because some grounds were over-extracted and others barely
      touched. Distribution and tamping are the usual causes.

  - id: "adi.espresso.note.resting"
    text: >
      Beans release carbon dioxide for a week or two after roasting, which
      disrupts extraction. Very fresh beans and stale beans both behave badly,
      for opposite reasons.
