[workspace]
resolver = "2"
members = [
    "crates/adi-protocol",
    "crates/adi-safety",
    "crates/adi-core",
    "crates/adi-decision",
    "crates/adi-language",
    "crates/adi-wire",
    "crates/adi-session",
    "crates/adi-models",
    "crates/adi-domain-espresso",
    "crates/adi-domain-base",
    "crates/adi-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["StreetAI"]

[workspace.dependencies]
adi-protocol = { path = "crates/adi-protocol" }
adi-safety = { path = "crates/adi-safety" }
adi-core = { path = "crates/adi-core" }
adi-decision = { path = "crates/adi-decision" }
adi-language = { path = "crates/adi-language" }
adi-wire = { path = "crates/adi-wire" }
adi-session = { path = "crates/adi-session" }
adi-models = { path = "crates/adi-models" }
adi-domain-espresso = { path = "crates/adi-domain-espresso" }
adi-domain-base = { path = "crates/adi-domain-base" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
