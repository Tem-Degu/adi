# Conformance cases: input and expected decision.
#
# These live in data rather than in Rust on purpose. When the engine is
# rewritten, ported, or reimplemented in another language, these files transfer
# unchanged and prove the new build behaves identically. The corpus is worth
# more than the implementation, because it is what lets you replace the
# implementation without fear.

profile: "espresso/v1"
declaration: "../../../examples/declarations/ex900.yaml"
skill: "../../../examples/declarations/ex900.skill.yaml"

cases:
  - id: "sour-and-fast-goes-finer"
    style: "adi.espresso.style.espresso"
    settings:
      dose_mass:     { value: 9.0,  unit: g }
      grind_setting: { value: 24,   unit: step }
    trace:
      signal: "adi.espresso.signal.mass"
      samples: [[0,0],[5,2],[10,8],[15,15],[20,24],[22,30]]
    feedback:
      descriptors: ["sour"]
    expect:
      cause: "under_extracted"
      target_variable: "shot_time"
      desired_delta_sign: positive
      selected_tool: "adi.espresso.grind.set_setting"
      direction: finer

  - id: "erratic-flow-is-channeling-not-grind"
    style: "adi.espresso.style.espresso"
    settings:
      dose_mass:     { value: 9.0, unit: g }
      grind_setting: { value: 24,  unit: step }
    trace:
      signal: "adi.espresso.signal.mass"
      samples: [[0,0],[5,1],[8,9],[10,10],[14,11],[16,22],[20,24],[21,31]]
    feedback:
      descriptors: ["sour", "bitter"]
    expect:
      cause: "channeling"
      # No actuation. Prescribing a grind change here makes the next shot worse,
      # which is why this case exists and why it must be checked first.
      target_variable: null
      selected_tool: null

  - id: "slow-and-bitter-goes-coarser"
    style: "adi.espresso.style.espresso"
    settings:
      dose_mass:     { value: 9.0, unit: g }
      grind_setting: { value: 18,  unit: step }
    trace:
      signal: "adi.espresso.signal.mass"
      samples: [[0,0],[10,3],[20,11],[30,20],[38,26],[41,30]]
    feedback:
      descriptors: ["bitter"]
    expect:
      cause: "over_extracted"
      target_variable: "shot_time"
      desired_delta_sign: negative
      selected_tool: "adi.espresso.grind.set_setting"
      direction: coarser

  - id: "in-target-does-nothing"
    style: "adi.espresso.style.espresso"
    settings:
      dose_mass:     { value: 9.0, unit: g }
      grind_setting: { value: 21,  unit: step }
    trace:
      signal: "adi.espresso.signal.mass"
      samples: [[0,0],[7,3],[14,10],[21,19],[28,27]]
    feedback:
      descriptors: ["balanced"]
    expect:
      cause: "balanced"
      target_variable: null
      selected_tool: null

  # The case that separates D0 from D1. The sweetener is a vendor tool with a
  # declared skill response, so the engine can reason about it, but a request
  # for "less sugar" must never be answered by changing the extraction.
  - id: "less-sugar-never-touches-extraction"
    style: "adi.espresso.style.for_milk"
    request: "half the sugar of last time"
    # The words above are what a person says. The structure below is what a
    # model must turn them into, and it is all the engine ever sees. Note that
    # it says "half of last time" rather than "4 g": the model is not trusted to
    # remember what last time was, nor to do the division. The engine resolves
    # the reference against memory.
    intent:
      kind: adjust
      style: "adi.espresso.style.for_milk"
      targets:
        sugar_mass: { of: last, scale: 0.5 }
    # Seeded as the remembered previous cycle, so "last time" means 8 g.
    settings:
      dose_mass:  { value: 9.0, unit: g }
      sugar_mass: { value: 8.0, unit: g }
    expect:
      cause: "preference_adjustment"
      target_variable: "sugar_mass"
      selected_tool: "x.example.additive.sweetener_pump"
      must_not_touch: ["grind_setting", "brew_temperature", "yield_mass"]

  # The next two cases carry the same shot and differ only by style. They exist
  # because the engine previously resolved targets from a hardcoded table that
  # matched on short names like "espresso", so every case here fell through to a
  # default and the declared style was ignored. A pair that must disagree is the
  # only way to keep that from happening again quietly.
  - id: "a-long-shot-is-over-extracted-as-an-espresso"
    style: "adi.espresso.style.espresso"
    settings:
      dose_mass:     { value: 9.0, unit: g }
      grind_setting: { value: 19,  unit: step }
    trace:
      signal: "adi.espresso.signal.mass"
      samples: [[0,0],[8,2],[16,9],[24,18],[32,26],[36,31]]
    feedback:
      descriptors: []
    expect:
      cause: "over_extracted"
      target_variable: "shot_time"
      desired_delta_sign: negative
      selected_tool: "adi.espresso.grind.set_setting"
      direction: coarser

  - id: "the-same-shot-is-in-target-as-a-lungo"
    style: "adi.espresso.style.lungo"
    settings:
      dose_mass:     { value: 9.0, unit: g }
      grind_setting: { value: 19,  unit: step }
    trace:
      signal: "adi.espresso.signal.mass"
      samples: [[0,0],[8,2],[16,9],[24,18],[32,26],[36,31]]
    feedback:
      descriptors: []
    expect:
      cause: "balanced"
      target_variable: null
      selected_tool: null

  # A material prior resolves alongside the style. Dark roast narrows brew
  # temperature; it must not disturb the shot time diagnosis.
  - id: "a-roast-prior-resolves-without-changing-the-diagnosis"
    style: "adi.espresso.style.espresso"
    material: "adi.espresso.roast.dark"
    settings:
      dose_mass:     { value: 9.0, unit: g }
      grind_setting: { value: 21,  unit: step }
    trace:
      signal: "adi.espresso.signal.mass"
      samples: [[0,0],[7,3],[14,10],[21,19],[28,27]]
    feedback:
      descriptors: ["balanced"]
    expect:
      cause: "balanced"
      target_variable: null
      selected_tool: null

  # The one thing still missing, declared rather than left implicit.
  #
  # The case above carries the same request already turned into structured
  # intent, and passes. This one carries only the words, which is what a person
  # actually produces. Turning words into intent is the model's job and the one
  # job on this path that is not deterministic, so this case stays pending until
  # a backend exists. It is here so the gap is visible in every run.
  - id: "spoken-request-needs-a-model"
    style: "adi.espresso.style.for_milk"
    request: "make it half as sweet as the last one"
    settings:
      dose_mass:  { value: 9.0, unit: g }
      sugar_mass: { value: 8.0, unit: g }
    expect:
      cause: "preference_adjustment"
      target_variable: "sugar_mass"
      selected_tool: "x.example.additive.sweetener_pump"
      must_not_touch: ["grind_setting", "brew_temperature", "yield_mass"]
