# Greenhouse profile sketch. Data only. See README.md in this directory.
#
# Deliberately unlike espresso: slow, overlapping, delayed feedback.

profile: "greenhouse/v0"

tools:
  - id: "adi.greenhouse.irrigation.dose"
    parameters:
      volume: { type: number, unit: ml, min: 0, max: 5000, resolution: 10 }
    effects: ["substrate_moisture"]
    reversible: false
    duration_ms_max: 600000

  - id: "adi.greenhouse.light.set_photoperiod"
    parameters:
      hours: { type: number, unit: s, min: 0, max: 86400, resolution: 900 }
    effects: ["daily_light_integral"]
    reversible: true

  - id: "adi.greenhouse.climate.set_temperature"
    parameters:
      temperature: { type: number, unit: c, min: 10.0, max: 40.0, resolution: 0.5 }
    effects: ["air_temperature"]
    reversible: true

  - id: "adi.greenhouse.nutrient.dose"
    parameters:
      volume: { type: number, unit: ml, min: 0, max: 500, resolution: 1 }
    effects: ["nutrient_concentration"]
    reversible: false

signals:
  - id: "adi.greenhouse.signal.substrate_moisture"
    unit: pct
    sample_rate_hz: 0.0017          # once every ten minutes
    accuracy: { abs: 2.0, unit: pct }
  - id: "adi.greenhouse.signal.air_temperature"
    unit: c
    sample_rate_hz: 0.0017
    accuracy: { abs: 0.3, unit: c }
  - id: "adi.greenhouse.signal.nutrient_ec"
    unit: pct
    sample_rate_hz: 0.0017
    accuracy: { abs: 1.5, unit: pct }

# Units and meanings, in the same shape the espresso knowledge base uses. This
# is where bare names fail hardest: a model has reliable intuitions about what
# makes coffee bitter and none at all about daily_light_integral, so a profile
# that does not state what its variables mean is relying on the model having
# read about the domain.
variables:
  substrate_moisture:
    unit: pct
    description: >
      Water held in the growing medium. Low stresses the plant; high excludes
      air from the roots.
  air_temperature:
    unit: c
    description: >
      Air temperature in the enclosure.
  daily_light_integral:
    unit: mol_per_m2_per_day
    description: >
      Total photosynthetically active light received over a day. The main
      determinant of growth rate, and accumulated rather than instantaneous.
  nutrient_concentration:
    unit: ppm
    description: >
      Dissolved nutrient in the feed solution. Low starves the plant; high
      draws water back out of the roots.
  growth_rate:
    unit: mm_per_day
    description: >
      Change in plant height per day. The outcome, observed over weeks rather
      than at the end of a cycle.
  leaf_health:
    unit: none
    description: >
      Subjective assessment of foliage. A judgement a person makes, not a
      measurement the machine takes.

# The point of the exercise. Espresso never produces numbers like these, and
# any neutral code that cannot represent them has an espresso assumption in it.
characteristics:
  cycle_duration_s: 604800          # one week
  feedback_delay_s: 1209600         # two weeks
  cycles_overlap: true
  subjects_per_cycle: many
  cost_of_overshoot: "a crop"

feedback_vocabulary:
  - "yellowing"
  - "wilting"
  - "leggy"
  - "healthy"
  - "slow"
  - "burnt_tips"
