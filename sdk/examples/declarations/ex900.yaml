# A fictional Level 2 superautomatic, with a stateful envelope.
#
# Includes a vendor tool (the sweetener pump) so the D0 vs D1 difference is
# exercisable: at D0 the engine cannot select it, at D1 the model can.

adip_version: "0.2"
domain: "espresso"
domain_profile: "espresso/v1"
conformance_level: autonomous

device:
  vendor: "Example Appliances"
  model: "EX-900"
  hardware_revision: "C"
  firmware_version: "3.2.1"
  declaration_id: "sha256:6f1cexample"

session:
  max_concurrent: 1
  heartbeat_interval_ms: 500
  control_timeout_ms: 2000

references:
  skill: "skill/EX-900/2.1"

signals:
  - id: "adi.espresso.signal.mass"
    unit: g
    range: { min: 0, max: 2000, unit: g }
    sample_rate_hz: 20
    accuracy: { abs: 0.2, unit: g }
  - id: "adi.espresso.signal.elapsed"
    unit: s
    sample_rate_hz: 20
    accuracy: { abs: 0.05, unit: s }
  - id: "adi.espresso.signal.group_temp"
    unit: c
    sample_rate_hz: 4
    accuracy: { abs: 0.5, unit: c }
  - id: "adi.espresso.signal.grind_setting"
    unit: step
    sample_rate_hz: 1
    accuracy: { abs: 1, unit: step }

tools:
  - id: "adi.espresso.grind.set_setting"
    name: "set_grind"
    parameters:
      setting:
        type: integer
        unit: step
        min: 0
        max: 60
        resolution: 1
        monotonic: profile_defined
    preconditions: ["state == idle"]
    effects: ["grind_setting"]
    duration_ms_typ: 2200
    duration_ms_max: 6000
    reversible: true

  - id: "adi.espresso.grind.purge"
    parameters:
      mass: { type: number, unit: g, min: 0.5, max: 5.0, resolution: 0.1 }
    effects: ["grinder_retention"]
    reversible: false

  - id: "adi.espresso.dose.by_mass"
    parameters:
      mass: { type: number, unit: g, min: 6.0, max: 14.0, resolution: 0.1 }
    effects: ["dose_mass"]
    reversible: false

  - id: "adi.espresso.brew.set_temperature"
    parameters:
      temperature: { type: number, unit: c, min: 88.0, max: 96.0, resolution: 0.5 }
    effects: ["brew_temperature"]
    duration_ms_typ: 15000
    reversible: true

  - id: "adi.espresso.brew.start"
    parameters:
      stop_at_mass: { type: number, unit: g, min: 15.0, max: 90.0, resolution: 0.5 }
    preconditions: ["state == ready", "water_present == true"]
    effects: ["yield_mass"]
    duration_ms_max: 60000
    reversible: false
    abortable: true
    hazard: ["hot_liquid", "pressure"]

  - id: "adi.espresso.additive.dispense"
    parameters:
      substance: { type: enum, values: ["milk", "water"] }
      volume: { type: number, unit: ml, min: 0, max: 300, resolution: 1 }
    effects: ["cup_contents"]
    reversible: false
    hazard: ["hot_liquid"]

  - id: "adi.espresso.puck.eject"
    preconditions: ["state == idle", "waste_bin_present == true"]
    effects: ["puck_state"]
    reversible: false

  # Vendor tool. Outside the registry, so meaningless to the engine until the
  # skill declares a response for it.
  - id: "x.example.additive.sweetener_pump"
    name: "sweetener"
    parameters:
      level: { type: integer, unit: g, min: 0, max: 20, resolution: 1 }
    preconditions: ["state == idle", "sweetener_present == true"]
    effects: ["sugar_mass"]
    reversible: false

events:
  - id: "adi.espresso.event.first_drip"
    payload:
      elapsed_s: { type: number, unit: s }

  - id: "adi.espresso.event.fault"
    payload:
      code: { type: string }
      severity: { type: enum, values: ["warning", "error", "critical"] }
      recoverable: { type: boolean }

envelope:
  enforced_by: both
  independent_of_engine: true

  limits:
    - { parameter: "temperature", unit: c, hard_min: 80.0, hard_max: 98.0 }
    - { parameter: "mass", unit: g, hard_max: 16.0 }

  interlocks:
    - { id: "water_present", blocks: ["adi.espresso.brew.start"] }
    - { id: "waste_bin_present", blocks: ["adi.espresso.brew.start", "adi.espresso.puck.eject"] }
    - { id: "service_door_closed", blocks: ["*"] }

  # Stateful constraints. Without these, three individually valid dispense
  # calls overflow the cup, and D2 refuses to initialise.
  invariants:
    - id: "cup_capacity"
      quantity: "cup_contents"
      max: 320.0
      unit: ml
      accumulates:
        "adi.espresso.additive.dispense": "volume"
        "adi.espresso.brew.start": "stop_at_mass"
      reset_on: ["adi.espresso.puck.eject"]

    - id: "sweetener_per_drink"
      quantity: "sugar_mass"
      max: 20.0
      unit: g
      accumulates:
        "x.example.additive.sweetener_pump": "level"
      reset_on: ["adi.espresso.puck.eject"]

  rate_limits:
    - id: "brew_thermal_recovery"
      tools: ["adi.espresso.brew.start"]
      min_interval_s: 25.0
      max_invocations: 12
      window_s: 600.0

  resources:
    - id: "water_reservoir"
      unit: ml
      capacity: 1800.0
      consumed_by:
        "adi.espresso.brew.start": "stop_at_mass"
        "adi.espresso.additive.dispense": "volume"

  failsafe:
    on_control_timeout: "abort_to_safe"
    on_signal_loss: "abort_to_safe"
    on_fault: "abort_to_safe"
    safe_state: "no_heat_no_pressure_no_motion"
    max_time_to_safe_ms: 500
